<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handover Teaching Wheel</title>
<meta name="description" content="One concept, ninety seconds. Forty one acute medicine teaching points for the end of handover.">
<link rel="canonical" href="https://spin.clinote.co/">

<!-- icons: relative paths so they resolve on both the custom domain and github.io -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Spin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- link previews (og:image must be absolute) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Handover Teaching Wheel">
<meta property="og:locale" content="en_GB">
<meta property="og:url" content="https://spin.clinote.co/">
<meta property="og:title" content="One concept, ninety seconds.">
<meta property="og:description" content="Spin the wheel for a ninety second acute medicine teaching point at the end of handover. Forty one topics across cardiology, respiratory, renal, neurology, infection and prescribing.">
<meta property="og:image" content="https://spin.clinote.co/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A multicoloured ring of 41 segments beside the words One concept, ninety seconds.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="One concept, ninety seconds.">
<meta name="twitter:description" content="Forty one acute medicine teaching points for the end of handover. Spin the wheel, teach for ninety seconds.">
<meta name="twitter:image" content="https://spin.clinote.co/og-image.png">
<meta name="twitter:image:alt" content="A multicoloured ring of 41 segments beside the words One concept, ninety seconds.">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell" id="shell">

  <h1>One concept, ninety seconds.</h1>

  <main class="stage">
    <section class="wheel-col" aria-label="Topic wheel">
      <div class="wheel-wrap">
        <div class="needle" aria-hidden="true">
          <svg viewBox="0 0 13 18"><path d="M6.5 18 L0.4 2.6 A6.5 6.5 0 0 1 12.6 2.6 Z"/></svg>
        </div>
        <svg viewBox="0 0 420 420" role="img" id="wheelSvg" aria-label="Wheel of teaching topics">
          <g id="wheel" transform-origin="210 210"></g>
        </svg>
        <div class="hub">
          <span class="num" id="doneCount">0</span>
          <span class="lab">of <span id="totalCount">0</span> delivered</span>
        </div>
      </div>

      <div class="legend" id="legend"></div>

      <div class="controls">
        <button class="spin" id="spinBtn">Spin the wheel</button>
        <div class="row">
          <button class="btn" id="undoBtn" disabled>Put last one back</button>
          <button class="btn" id="indexBtn">Browse all</button>
          <button class="btn" id="fsBtn">Full screen</button>
          <button class="btn" id="resetBtn">Reset</button>
        </div>
      </div>
    </section>

    <section class="card" id="card" aria-live="polite"></section>
  </main>

  <section class="index" id="index" hidden>
    <div class="grid" id="grid"></div>
  </section>

</div>

<!-- the reveal: number and specialty, tap to open the teaching point -->
<div class="overlay result-layer" id="resultLayer" hidden>
  <div class="overlay-backdrop" data-dismiss></div>
  <div class="result-card" id="resultCard" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <button class="round-btn result-dismiss" id="resultClose" type="button" aria-label="Close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 3.4 12.6 12.6M12.6 3.4 3.4 12.6"/></svg>
    </button>
    <p class="result-eyebrow"><span class="dot"></span><span id="resultSystem"></span></p>
    <p class="result-num"><span class="hash">No.</span><span id="resultNumber"></span></p>
    <p class="result-theme" id="resultTheme"></p>
    <h2 class="result-title" id="resultTitle"></h2>
    <button class="spin result-go" id="resultOpen" type="button">Read the teaching point</button>
  </div>
</div>

<!-- the teaching point itself, over everything -->
<div class="overlay sheet-layer" id="sheetLayer" hidden>
  <div class="overlay-backdrop" data-dismiss></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <span class="sheet-grip" aria-hidden="true"></span>
    <button class="round-btn sheet-close" id="sheetClose" type="button" aria-label="Close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 3.4 12.6 12.6M12.6 3.4 3.4 12.6"/></svg>
    </button>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
